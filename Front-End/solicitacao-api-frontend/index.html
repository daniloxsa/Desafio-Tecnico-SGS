<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS • Gerenciamento de Solicitações</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <h1 class="logo">SGS • Gerenciamento de Solicitações</h1>
        <button class="btn-nav">Solicitantes</button>
    </header>

    <main class="main-container">
        <h2 class="page-title">SOLICITAÇÕES</h2>

        <section class="filter-box">
            <div class="filter-inputs">
                <select class="input-field">
                    <option value="">Status</option>
                </select>
                <select class="input-field">
                    <option value="">Categoria</option>
                </select>
                <input type="date" class="input-field" placeholder="data">
                <input type="date" class="input-field" placeholder="data">
                <input type="number" class="input-field" placeholder="valor">
                <input type="number" class="input-field" placeholder="valor">
            </div>
            <div class="filter-actions">
                <button class="btn-filter">FILTRAR</button>
                <button class="btn-clear">LIMPAR</button>
            </div>
        </section>

        <section class="cards-wrapper">
            <div class="cards-grid" id="cardsContainer">

                <article class="card">
                    <div class="card-header">solicitanteNome</div>
                    <div class="card-body">
                        <p><strong>dataSolicitacao:</strong> 2026-08-29</p>
                        <p><strong>categoriaNome:</strong> Material</p>
                        <p><strong>status:</strong> SOLICITADO</p>
                        <p><strong>valor:</strong> R$ 150,00</p>
                        <button class="btn-details">Detalhes</button>
                    </div>
                </article>

            </div>

            <button class="btn-floating">+</button>
        </section>
    </main>

    <div class="modal-overlay" id="createModal">
        <div class="modal-content">
            <form class="modal-form">
                <input type="number" class="modal-input" placeholder="valor">
                <input type="text" class="modal-input" placeholder="categoria">
                <input type="text" class="modal-input" placeholder="solicitante">
                <textarea class="modal-input textarea" placeholder="descrição"></textarea>
                <button type="button" class="btn-submit">CRIAR</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
