<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS • Solicitantes</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>

    <header class="navbar">
        <h1 class="logo">SGS • Gerenciamento de Solicitações</h1>
        <a href="index.html">
            <button class="btn-nav">Solicitações</button>
        </a>
    </header>

    <main class="main-container">
        <h2 class="page-title">SOLICITANTES</h2>

        <div class="content-grid">

            <section class="table-wrapper">
                <table class="solicitacoes-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF / CNPJ</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tableSolicitantesBody">
                    </tbody>
                </table>

                <button class="btn-floating" id="btnAbrirCriarSolicitante">+</button>
            </section>

            <aside class="side-panel">
                <h3 style="text-align: center; margin-bottom: 15px;">SOLICITAÇÕES</h3>
                <div class="side-panel-content" id="panelSolicitacoes">
                </div>
            </aside>

        </div>

    </main>

    <div class="modal-overlay" id="createSolicitanteModal">
        <div class="modal-content">
            <h3 style="color: #4285f4; margin-bottom: 15px;">Novo Solicitante</h3>
            <form class="modal-form" id="formCriarSolicitante">
                <input type="text" class="modal-input" id="createNomeSolicitante" placeholder="nome" required>
                <input type="text" class="modal-input" id="createCpfCnpjSolicitante" placeholder="CPF / CNPJ" required>

                <div style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
                    <button type="button" class="btn-clear" id="btnCancelarCriarSolicitante">CANCELAR</button>
                    <button type="submit" class="btn-submit">CRIAR</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../script/solicitantes.js"></script>

</body>

</html>
